name: Apply Web Push

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_web_push.py'
      - '.github/workflows/apply-web-push.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Web Push client
        run: python3 tools/patch_web_push.py
      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Guard Web Push features
        run: |
          grep -q "register_push_subscription" app/src/main/assets/app.js
          grep -q "VAPID_PUBLIC" app/src/main/assets/app.js
          grep -q "push-settings" app/src/main/assets/app.js
      - name: Commit Web Push client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add PWA Web Push subscription controls"
          git push
