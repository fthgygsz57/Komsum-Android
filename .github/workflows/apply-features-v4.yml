name: Apply Komşum Feature Upgrade

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch_features_v4.py'
      - '.github/workflows/apply-features-v4.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply feature patch
        run: python3 tools/patch_features_v4.py

      - name: Add feature styles
        run: |
          cat >> app/src/main/assets/styles.css <<'CSS'

          /* Komşum v4 feature styles */
          .content-photo{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin:10px 0 12px;background:var(--card,#fff)}
          .form-photo{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin:8px 0}
          .check-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
          .count-pill{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:#346B4A;color:#fff;font-size:11px;line-height:1}
          .unread-row{font-weight:600;background:rgba(52,107,74,.06)}
          .unread-dot{display:block;width:9px;height:9px;border-radius:50%;background:#346B4A;flex:0 0 auto}
          .chat-stack{max-height:52vh;overflow:auto;padding-right:2px}
          .danger-btn{background:#9f2f2f!important;border-color:#9f2f2f!important;color:#fff!important}
          .setting-row .text-btn{white-space:nowrap}
          @media(max-width:520px){.setting-row{gap:9px}.setting-row .text-btn{font-size:11px;padding:6px}.content-photo{max-height:300px}}
          CSS

      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js

      - name: Guard important features
        run: |
          grep -q "function notificationsPage" app/src/main/assets/app.js
          grep -q "function adminPage" app/src/main/assets/app.js
          grep -q "uploadMedia" app/src/main/assets/app.js
          grep -q "delete-account" app/src/main/assets/app.js

      - name: Commit upgraded application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/app.js app/src/main/assets/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Add photos notifications account admin and messaging upgrades"
          git push
