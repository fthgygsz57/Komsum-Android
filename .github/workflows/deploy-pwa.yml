name: Deploy Komşum PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/res/drawable/ic_launcher.png'
      - 'pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare PWA site
        run: |
          mkdir -p _site/assets
          cp app/src/main/assets/index.html _site/index.html
          cp app/src/main/assets/styles.css _site/styles.css
          cp app/src/main/assets/app.js _site/app.js
          cp pwa/manifest.webmanifest _site/manifest.webmanifest
          cp pwa/sw.js _site/sw.js
          cp app/src/main/res/drawable/ic_launcher.png _site/assets/icon-512.png
          cp app/src/main/res/drawable/ic_launcher.png _site/assets/icon-192.png
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
