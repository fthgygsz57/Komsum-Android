name: Apply Site Layer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-site-layer.yml'
      - '.github/scripts/patch_site_layer.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch application
        run: python3 .github/scripts/patch_site_layer.py
      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add residential site selection flow"
          git push
