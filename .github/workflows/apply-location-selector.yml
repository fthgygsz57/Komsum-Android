name: Apply Mahalle Selector

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_location_selector.py'
      - '.github/workflows/apply-location-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply selector patch
        run: python scripts/apply_location_selector.py

      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/app.js
          if git diff --cached --quiet; then
            echo "No application changes"
          else
            git commit -m "Add canonical PTT neighborhood selector"
            git push origin main
          fi
